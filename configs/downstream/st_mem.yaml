seed: 0
output_dir: ./final_down_linear/focal
exp_name: AAAA
resume: null
start_epoch: 0
encoder_path: /workspace/
model_name: st_mem_vit_base
mode: linprobe
device: cuda

ddp:
  world_size: 1
  rank: -1
  gpu: 0
  dist_url: env://
  dist_backend: nccl
  distributed: true

model:
  seq_len: 1000
  patch_size: 25
  num_leads: 12
  num_classes: 2

dataset:
  filename_col: RELATIVE_FILE_PATH
  fs_col: SAMPLE_RATE
  label_col: LABEL
  label_dtype: long
  lead: 12lead
  fs: 100
  index_dir: /workspace/
  ecg_dir: /workspace/
  all_data_csv: /workspace/
  current_fold: 0  

  train_csv: 
  valid_csv: 
  test_csv: 

  rand_augment:
    use: false
    kwargs:
      op_names:
      - shift
      - cutout
      - drop
      - flip
      - erase
      - sine
      - partial_sine
      - partial_white_noise
      level: 10
      num_layers: 2
      prob: 0.5
  train_transforms:
  - random_crop:
      crop_length: 1000
  - highpass_filter:
      fs: 100
      cutoff: 0.67
  - lowpass_filter:
      fs: 100
      cutoff: 40
  - standardize:
      axis: [-1, -2]
  eval_transforms:
  # - n_crop:
  #     crop_length: 1000
  #     num_segments: 2
  - highpass_filter:
      fs: 100
      cutoff: 0.67
  - lowpass_filter:
      fs: 100
      cutoff: 40
  - standardize:
      axis: [-1, -2]

dataloader:
  batch_size: 128
  num_workers: 2
  pin_memory: True

train:
  epochs: 85
  accum_iter: 8
  warmup_epochs: 5
  min_lr: 0
  blr: 1.0e-3
  lr: 0.001
  weight_decay: 0.05
  dist_eval: false
  max_norm: null
  optimizer: adamw

loss:
  name: focal_loss

metric:
  task: multiclass
  compute_on_cpu: true
  sync_on_compute: false
  num_classes: 2
  target_metrics:
  - Accuracy
  - F1Score:
      average: macro
  - AUROC:
      average: macro

test:
  target_metric: loss
